# Example nginx snippets for Monster Scanner v0.3 on an air-gapped Raspberry Pi.
# Merge these into your existing HTTPS server block (do not replace your certs).

# Safari needs correct MIME types for ES modules and WebAssembly.
types {
    text/html                        html;
    text/css                         css;
    application/javascript           js mjs;
    application/wasm                 wasm;
    application/octet-stream         tflite;
    image/png                        png;
    image/jpeg                       jpg jpeg;
    image/svg+xml                    svg;
}

server {
    listen 443 ssl;
    server_name _;

    # Your existing self-signed / local-CA certs go here.
    # ssl_certificate     /path/to/server.crt;
    # ssl_certificate_key /path/to/server.key;

    root /var/www/monsterscanner;
    index index.html;

    autoindex off;

    # App files — short cache so UI tweaks show up quickly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vendored MediaPipe never changes between events.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # No proxy, no resolver, no analytics beacons.
}
